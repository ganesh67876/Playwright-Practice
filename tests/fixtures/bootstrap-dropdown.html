<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Dropdown Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
      }

      .dropdown {
        position: relative;
        display: inline-block;
      }

      .dropdown-toggle {
        padding: 10px 14px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
      }

      .dropdown-menu {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        min-width: 180px;
        margin-top: 4px;
        padding: 6px 0;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        z-index: 1000;
      }

      .dropdown-menu.show {
        display: block;
      }

      .dropdown-item {
        display: block;
        padding: 8px 12px;
        color: #333;
        text-decoration: none;
      }

      .dropdown-item:hover {
        background: #f5f5f5;
      }
    </style>
  </head>
  <body>
    <div class="dropdown">
      <button id="dropdownButton" class="dropdown-toggle" type="button">Select an option</button>
      <div id="dropdownMenu" class="dropdown-menu">
        <a class="dropdown-item" href="#">Action</a>
        <a class="dropdown-item" href="#">Another action</a>
        <a class="dropdown-item" href="#">Something else here</a>
      </div>
    </div>

    <script>
      const toggleButton = document.getElementById('dropdownButton');
      const menu = document.getElementById('dropdownMenu');

      toggleButton.addEventListener('click', () => {
        menu.classList.toggle('show');
      });
    </script>
  </body>
</html>
